# Sirve la SPA y hace de proxy inverso hacia el backend (REST + WebSocket STOMP)
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location ~ ^/(swagger-ui|v3/api-docs|actuator) { proxy_pass http://backend:8080; }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri /index.html; }
}
