name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 · pruebas Cucumber + integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      - name: Reporte Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: backend/target/cucumber.html

  postgres:
    name: Migraciones sobre PostgreSQL 16
    runs-on: ubuntu-latest
    needs: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kartrent
          POSTGRES_USER: kartrent
          POSTGRES_PASSWORD: kartrent
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kartrent" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Pruebas de integración contra PostgreSQL real
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kartrent
          DB_USER: kartrent
          DB_PASSWORD: kartrent
        run: mvn -B test -Dtest=FlujoCompletoApiTest -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  diagramas:
    name: Diagramas PlantUML (4+1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar PNG y SVG
        run: |
          docker run --rm -v "$PWD/diagramas:/data" -w /data plantuml/plantuml:latest -tpng -o /data/img plantuml/*.puml
          docker run --rm -v "$PWD/diagramas:/data" -w /data plantuml/plantuml:latest -tsvg -o /data/img plantuml/*.puml
      - uses: actions/upload-artifact@v4
        with:
          name: diagramas
          path: diagramas/img
