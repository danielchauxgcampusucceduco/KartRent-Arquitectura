name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 · pruebas Cucumber + integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      - name: Resumen de cobertura (JaCoCo)
        run: |
          awk -F, 'NR>1 {c+=$9; m+=$8} END {printf "Cobertura de lineas: %.1f%% (%d de %d)\n", 100*c/(c+m), c, c+m}' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reporte Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: backend/target/cucumber.html
      - name: Informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco

  postgres:
    name: Migraciones sobre PostgreSQL 16
    runs-on: ubuntu-latest
    needs: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kartrent
          POSTGRES_USER: kartrent
          POSTGRES_PASSWORD: kartrent
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U kartrent" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Pruebas de integración contra PostgreSQL real
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/kartrent
          DB_USER: kartrent
          DB_PASSWORD: kartrent
        run: mvn -B test -Dtest=FlujoCompletoApiTest -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Variables de ejemplo para construir las imágenes
        run: cp .env.example .env
      - run: docker compose build

  diagramas:
    name: Diagramas PlantUML (cinco vistas)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar PNG y SVG (falla si algún diagrama tiene errores de sintaxis)
        run: |
          mkdir -p diagramas/render && chmod 777 diagramas/render
          docker run --rm -v "$PWD/diagramas:/data" -w /data plantuml/plantuml:latest -failfast2 -tpng -o ../render plantuml/*.puml
          docker run --rm -v "$PWD/diagramas:/data" -w /data plantuml/plantuml:latest -failfast2 -tsvg -o ../render plantuml/*.puml
      - uses: actions/upload-artifact@v4
        with:
          name: diagramas
          path: diagramas/render
      - name: Publicar las imágenes en el repositorio
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "KartRent CI"
          git config user.email "ci@kartrent.local"
          git add diagramas/render
          if git diff --cached --quiet; then echo "Imágenes sin cambios"; else
            git commit -m "Imágenes renderizadas de los diagramas generadas por la CI [skip ci]"
            git push
          fi
