# Mantiene despierta la demo desplegada en Render (plan gratuito: se apaga tras 15 minutos sin tráfico).
# Solo en horario de clase (lunes a viernes, 7:00 a 19:00 hora de Colombia) para no gastar las horas gratuitas del mes.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow") antes de exponer.
name: Mantener la demo despierta

on:
  schedule:
    - cron: "*/5 12-23 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Despertar frontend y backend
        run: |
          # /actuator/health del frontend pasa por nginx al backend, así que despierta los dos servicios.
          for i in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://kartrent.onrender.com/actuator/health || true)
            echo "intento $i: $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 15
          done
          echo "La demo no respondió a tiempo"; exit 1
