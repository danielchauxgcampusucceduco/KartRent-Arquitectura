spring:
  application:
    name: kartrent-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:kartrent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    # Migraciones comunes + las específicas del motor (db/vendor/h2 o db/vendor/postgresql).
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

kartrent:
  zona-horaria: America/Bogota
  cors-origenes: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Sin valor por defecto: la aplicación no arranca si no se definen (perfil "dev" para desarrollo local).
  webhook-secreto: ${WEBHOOK_SECRET}
  expiracion-ms: 60000
  seguridad:
    admin-password: ${ADMIN_PASSWORD}
    boxes-password: ${BOXES_PASSWORD}
    cronometraje-password: ${CRONOMETRAJE_PASSWORD}
    mecanico-password: ${MECANICO_PASSWORD}
