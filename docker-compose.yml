# Vista de despliegue de KartRent: base de datos, servidor de aplicaciones y frontend.
#   docker compose up --build   →   http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kartrent
      POSTGRES_USER: kartrent
      POSTGRES_PASSWORD: kartrent
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartrent"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/kartrent
      DB_USER: kartrent
      DB_PASSWORD: kartrent
      CORS_ORIGINS: http://localhost:3000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-cambia-este-secreto}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  datos:
